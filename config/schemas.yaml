schemas:

  bronze:

    acled:
      file_type: xlsx
      reader:
        sheet_name: 0
        header: 0

      required_columns:
        - COUNTRY
        - MONTH
        - YEAR
        - EVENTS

    gdelt:
      file_type: csv
      reader:
        sep: "\t"
        skipinitialspace: true
        header: null
        names:
          - GLOBALEVENTID
          - SQLDATE
          - MonthYear
          - Year
          - FractionDate
          - Actor1Code
          - Actor1Name
          - Actor1CountryCode
          - Actor1KnownGroupCode
          - Actor1EthnicCode
          - Actor1Religion1Code
          - Actor1Religion2Code
          - Actor1Type1Code
          - Actor1Type2Code
          - Actor1Type3Code
          - Actor2Code
          - Actor2Name
          - Actor2CountryCode
          - Actor2KnownGroupCode
          - Actor2EthnicCode
          - Actor2Religion1Code
          - Actor2Religion2Code
          - Actor2Type1Code
          - Actor2Type2Code
          - Actor2Type3Code
          - IsRootEvent
          - EventCode
          - EventBaseCode
          - EventRootCode
          - QuadClass
          - GoldsteinScale
          - NumMentions
          - NumSources
          - NumArticles
          - AvgTone
          - Actor1Geo_Type
          - Actor1Geo_FullName
          - Actor1Geo_CountryCode
          - Actor1Geo_ADM1Code
          - Actor1Geo_Lat
          - Actor1Geo_Long
          - Actor1Geo_FeatureID
          - Actor2Geo_Type
          - Actor2Geo_FullName
          - Actor2Geo_CountryCode
          - Actor2Geo_ADM1Code
          - Actor2Geo_Lat
          - Actor2Geo_Long
          - Actor2Geo_FeatureID
          - ActionGeo_Type
          - ActionGeo_FullName
          - ActionGeo_CountryCode
          - ActionGeo_ADM1Code
          - ActionGeo_Lat
          - ActionGeo_Long
          - ActionGeo_FeatureID
          - DATEADDED
          - SOURCEURL

      required_columns:
        - GLOBALEVENTID
        - SQLDATE
        - Actor1CountryCode
        - EventCode
      
  silver:

    acled:
      transform_name: silver_standard_v1

      rename_columns:
          COUNTRY: country
          MONTH: month
          YEAR: year
          EVENTS: num_events
          
      required_columns: 
        - country
        - month
        - year
        - num_events

      primary_key: 
        - country
        - month 
        - year

      dtypes:
        country: string
        month: string 
        year: int64
        num_events: int64

    gdelt:

      transform_name: silver_standard_v1

      rename_columns:
          GLOBALEVENTID: event_id
          SQLDATE: event_date
          Actor1Name: actor1_name
          Actor2Name: actor2_name
          NumMentions: num_mentions
          NumSources: num_sources 
          NumArticles: num_articles
          AvgTone: avg_tone 
          
      required_columns: 
        - event_id
        - event_date

      primary_key: 
        - event_id

      partition_key: 
        - event_date 

      dtypes:
        event_id: string
        event_date: datetime64[ns]
        actor1_name: string
        actor2_name: string
        num_mentions: int64
        num_sources: int64
        num_articles: int64
        avg_tone: float64

      record_timestamp: _bronze_ingested_at


  gold: 

    crisis_event_activity:
      description: >
        Unified crisis and political event indicators across sources.

      datasets:

        - name: events_by_country_day
          grain:
            - country
            - date
          sources:
            - acled
            - gdelt
          metrics:
            total_events: count

        - name: fatalities_by_country_month
          grain:
            - country
            - year
            - month
          sources:
            - acled
          metrics:
            total_fatalities: sum

