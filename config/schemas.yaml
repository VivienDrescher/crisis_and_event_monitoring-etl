schemas:

  bronze:

    acled:
      required_columns:
        - COUNTRY
        - MONTH 
        - YEAR 
        - EVENTS

    gdelt:
      required_columns:
        - GLOBALEVENTID
        - SQLDATE
        - Actor1CountryCode
        - EventCode
      
  silver:

    acled:
      transform_name: silver_standard_v1

      rename_columns:
          COUNTRY: country
          MONTH: month
          YEAR: year
          EVENTS: num_events
          
      required_columns: 
        - country
        - month
        - year
        - num_events

      primary_key: 
        - country
        - month 
        - year

      dtypes:
        country: string
        month: string 
        year: int64
        num_events: int64

    gdelt:

      transform_name: silver_standard_v1

      rename_columns:
          GLOBALEVENTID: event_id
          SQLDATE: event_date
          Actor1Name: actor1_name
          Actor2Name: actor2_name
          NumMentions: num_mentions
          NumSources: num_sources 
          NumArticles: num_articles
          AvgTone: avg_tone 
          
      required_columns: 
        - event_id
        - event_date

      primary_key: 
        - event_id

      partition_key: 
        - event_date 

      dtypes:
        event_id: string
        event_date: datetime64[ns]
        actor1_name: string
        actor2_name: string
        num_mentions: int64
        num_sources: int64
        num_articles: int64
        avg_tone: float64

      record_timestamp: _bronze_ingested_at


  gold: 

    crisis_event_activity:
      description: >
        Unified crisis and political event indicators across sources.

      datasets:

        - name: events_by_country_day
          grain:
            - country
            - date
          sources:
            - acled
            - gdelt
          metrics:
            total_events: count

        - name: fatalities_by_country_month
          grain:
            - country
            - year
            - month
          sources:
            - acled
          metrics:
            total_fatalities: sum

