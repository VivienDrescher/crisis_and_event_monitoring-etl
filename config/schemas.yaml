schemas:

  bronze:

    acled:
      required_columns:
        - COUNTRY
        - MONTH 
        - YEAR 
        - EVENTS

    gdelt:
      required_columns:
        - GLOBALEVENTID
        - SQLDATE
        - Actor1CountryCode
        - EventCode
      
  silver:

    acled:
      primary_key: event_id_cnty

      dtypes:
        event_id_cnty: string
        event_date: date
        country: string
        event_type: string
        fatalities: int
        latitude: float
        longitude: float

      constraints:
        fatalities:
          min: 0
        latitude:
          min: -90
          max: 90
        longitude:
          min: -180
          max: 180

      allow_nulls:
        - latitude
        - longitude

    gdelt:

      transform_name: silver_standard_v1

      rename_columns:
          GLOBALEVENTID: event_id
          SQLDATE: event_at
          Actor1Name: actor1_name
          Actor2Name: actor2_name
          NumMentions: num_mentions
          NumSources: num_sources 
          NumArticles: num_articles
          AvgTone: avg_tone 
          
      required_columns: 
        - event_id
        - event_at

      primary_key: 
        - event_id

      timestamp_column: event_at

      dtypes:
        event_id: string
        event_at: datetime64[ns]
        actor1_name: string
        actor2_name: string
        num_mentions: int64
        num_sources: int64
        num_articles: int64
        avg_tone: float64


  gold: 

    crisis_event_activity:
      description: >
        Unified crisis and political event indicators across sources.

      datasets:

        - name: events_by_country_day
          grain:
            - country
            - date
          sources:
            - acled
            - gdelt
          metrics:
            total_events: count

        - name: fatalities_by_country_month
          grain:
            - country
            - year
            - month
          sources:
            - acled
          metrics:
            total_fatalities: sum

