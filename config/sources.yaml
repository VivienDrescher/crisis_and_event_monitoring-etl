sources:

  acled:
    enabled: true
    update_frequency: irregular
    aquisition_method: manual_drop
    ingestion_mode: latest_snapshot
    file_type: xlsx
    path_template:
      base_url: "https://acleddata.com/system/files"
      folder_pattern: "{year}-{month:02d}"
      filename_pattern: "number_of_political_violence_events_by_country-month-year_as-of-{day:02d}{month_abbr}{year}.xlsx"
      date_format:
        month_abbr: "%b"
    reader:
      sheet_name: 0
      header: 0

  gdelt:
    enabled: true
    update_frequency: daily
    aquisition_method: http_download
    ingestion_mode: append
    file_type: csv
    compression: zip 
    path_template:
      base_url: "http://data.gdeltproject.org/events"
      filename_pattern: "{year}{month:02d}{day:02d}.export.CSV.zip"
    reader:
      sep: "\t"
      skipinitialspace: true
      header: null
      names:
        - GLOBALEVENTID
        - SQLDATE
        - MonthYear
        - Year
        - FractionDate
        - Actor1Code
        - Actor1Name
        - Actor1CountryCode
        - Actor1KnownGroupCode
        - Actor1EthnicCode
        - Actor1Religion1Code
        - Actor1Religion2Code
        - Actor1Type1Code
        - Actor1Type2Code
        - Actor1Type3Code
        - Actor2Code
        - Actor2Name
        - Actor2CountryCode
        - Actor2KnownGroupCode
        - Actor2EthnicCode
        - Actor2Religion1Code
        - Actor2Religion2Code
        - Actor2Type1Code
        - Actor2Type2Code
        - Actor2Type3Code
        - IsRootEvent
        - EventCode
        - EventBaseCode
        - EventRootCode
        - QuadClass
        - GoldsteinScale
        - NumMentions
        - NumSources
        - NumArticles
        - AvgTone
        - Actor1Geo_Type
        - Actor1Geo_FullName
        - Actor1Geo_CountryCode
        - Actor1Geo_ADM1Code
        - Actor1Geo_Lat
        - Actor1Geo_Long
        - Actor1Geo_FeatureID
        - Actor2Geo_Type
        - Actor2Geo_FullName
        - Actor2Geo_CountryCode
        - Actor2Geo_ADM1Code
        - Actor2Geo_Lat
        - Actor2Geo_Long
        - Actor2Geo_FeatureID
        - ActionGeo_Type
        - ActionGeo_FullName
        - ActionGeo_CountryCode
        - ActionGeo_ADM1Code
        - ActionGeo_Lat
        - ActionGeo_Long
        - ActionGeo_FeatureID
        - DATEADDED
        - SOURCEURL